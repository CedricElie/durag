{{- if .Values.resourceQuota.enabled -}}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "durag.fullname" . }}-quota
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "durag.labels" . | nindent 4 }}
spec:
  hard:
    {{- if .Values.resourceQuota.hard.requestsCpu }}
    requests.cpu: {{ .Values.resourceQuota.hard.requestsCpu | quote }}
    {{- end }}
    {{- if .Values.resourceQuota.hard.requestsMemory }}
    requests.memory: {{ .Values.resourceQuota.hard.requestsMemory | quote }}
    {{- end }}
    {{- if .Values.resourceQuota.hard.limitsCpu }}
    limits.cpu: {{ .Values.resourceQuota.hard.limitsCpu | quote }}
    {{- end }}
    {{- if .Values.resourceQuota.hard.limitsMemory }}
    limits.memory: {{ .Values.resourceQuota.hard.limitsMemory | quote }}
    {{- end }}
    {{- if .Values.resourceQuota.hard.pods }}
    pods: {{ .Values.resourceQuota.hard.pods | quote }}
    {{- end }}
{{- end }}
