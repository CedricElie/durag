{{- if .Values.secrets.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "durag.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "durag.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.postgres.password }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgres.password | quote }}
  {{- end }}
  {{- if .Values.secrets.minio.rootUser }}
  MINIO_ROOT_USER: {{ .Values.secrets.minio.rootUser | quote }}
  {{- end }}
  {{- if .Values.secrets.minio.rootPassword }}
  MINIO_ROOT_PASSWORD: {{ .Values.secrets.minio.rootPassword | quote }}
  {{- end }}
  {{- if .Values.secrets.llm.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.secrets.llm.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.llm.geminiApiKey }}
  GEMINI_API_KEY: {{ .Values.secrets.llm.geminiApiKey | quote }}
  {{- end }}
  {{- with .Values.secrets.extraSecrets }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
