# Example unencrypted secrets file for durag Helm chart.
# Fulfills Phase 0.8 secrets management strategy.
#
# DO NOT commit sensitive values in plaintext.
# Encrypt this file with SOPS before committing:
#   sops -e -i charts/durag/secrets.yaml
#
# Deploy with helm-secrets:
#   helm secrets upgrade --install durag ./charts/durag -f charts/durag/values-local.yaml -f charts/durag/secrets.yaml

secrets:
  enabled: true
  postgres:
    password: "change-me-postgres-password"
  minio:
    rootUser: "durag-admin"
    rootPassword: "change-me-minio-password"
  llm:
    openaiApiKey: "sk-optional-openai-key"
    geminiApiKey: "optional-gemini-key"
  extraSecrets:
    # Optional provider OAuth tokens or custom secrets
    # GMAIL_CLIENT_SECRET: "optional-oauth-secret"
