[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "durag"
version = "0.1.0"
description = "Private, long-lived operational knowledge base with verifiable provenance and hybrid RAG retrieval"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "Cedric KOUEKAM", email = "cedric@durag.local" },
    { name = "Guylaine NGOUDJO", email = "guylaine@durag.local" }
]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
durag = "durag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []
