kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  # Control plane node with ingress port mappings (host 8088 -> container 80, host 8443 -> container 443)
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8088
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP

  # Worker node for general compute and stateless services
  - role: worker
    labels:
      durag.io/node-type: "compute"

  # Worker node for stateful services (MinIO, PostgreSQL / pgvector)
  - role: worker
    labels:
      durag.io/node-type: "storage"

# Containerd config patch to support the local image registry (localhost:5001)
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:5001"]
      endpoint = ["http://kind-registry:5000"]
